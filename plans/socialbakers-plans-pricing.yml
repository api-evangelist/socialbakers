model: >-
  Three packages (Social Marketing, Social Care, Social Commerce), each sold in
  three tiers (Essential, Advanced, Intelligent). Pricing is value-based rather
  than per-seat — every tier advertises unlimited user licences, unlimited
  connected profiles and unlimited ad-account connections; the tier boundaries
  are set by AI capability, governance/teams limits, public-profile
  benchmarking quotas and integration access. Only the two Social Marketing
  entry tiers publish a "starting at" figure; the remaining seven tiers are
  quote-only.
api_access:
  note: >-
    API access is a TIER-GATED feature, not a universal one. The Social
    Marketing Intelligent tier is the tier whose published summary names "API
    access"; Social Commerce Advanced names "Integrate with BI Tools via API",
    and the feature matrix lists "BI Tool Integration" (analytics API endpoints)
    and "Looker Studio Integration" (Emplifi API data connector) as tier-gated
    rows. Separately, the documentation states the Emplifi Public API "is not
    enabled by default" and is switched on by Emplifi Support / a Customer
    Success Manager per account.
  evidence:
  - https://emplifi.io/pricing/
  - https://docs.emplifi.io/platform/latest/home/emplifi-public-api-integration.md
