  notices:
  - name: Facebook Metric Deprecation (June 2026)
    url: https://docs.emplifi.io/platform/latest/home/facebook-metric-deprecation-june-2026.md
    api_affecting: true
    advance_notice: >-
      Flagged in the January 8, January 21 and February 4, 2026 release notes
      before the June 19, 2026 rollout.
    summary: >-
      Meta retired several Facebook unique-reach metrics; Emplifi switched
      Content, Dashboard, Unified Analytics AND the Emplifi API to Meta's media
      viewers endpoints on 2026-06-19. Paid/organic unique reach and unique
      video views were removed with no like-for-like replacement; replaced
      metrics keep their names with a changed underlying definition, backfilled
      to 2025-05-01 with no blended period.
