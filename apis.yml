aid: socialbakers
name: Socialbakers
description: >-
  Socialbakers was a pioneering social media analytics and marketing platform
  (founded 2008 in Prague) that let brands and agencies benchmark, measure and
  optimize their presence across Facebook, Instagram, X/Twitter, YouTube,
  LinkedIn, Pinterest, TikTok and Snapchat. In 2021 Socialbakers was acquired
  by Astute and rebranded to Emplifi, a unified social customer experience
  platform combining social marketing, commerce and care. The former
  Socialbakers Public API lives on as the Emplifi Public API (v3) at
  api.emplifi.io, exposing profile and post metrics, published content, social
  listening, community engagement, Facebook Ads, digital asset management and
  customer care data. Authentication is HTTP Basic (API token/secret) or OAuth
  2.0 authorization code, with hourly rate limits and cursor-paginated content
  endpoints.
