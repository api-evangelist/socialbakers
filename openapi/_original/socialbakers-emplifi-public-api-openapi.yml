  /3/listening/queries:
    get:
      operationId: getListeningQueries
      summary: List configured social listening queries
      tags: [Reference]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /3/ads/accounts:
    post:
      operationId: listAdAccounts
      summary: List connected ad accounts
      tags: [Reference]
      requestBody: { $ref: '#/components/requestBodies/Query' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /3/facebook/metrics:
    post:
      operationId: getFacebookMetrics
      summary: Facebook profile metrics
      tags: [Profile Metrics]
      requestBody: { $ref: '#/components/requestBodies/MetricsQuery' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /3/instagram/metrics:
