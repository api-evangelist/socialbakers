        '401': { $ref: '#/components/responses/Unauthorized' }
  /3/ads/metrics:
    post:
      operationId: getAdsMetrics
      summary: Facebook Ads metrics
      tags: [Ads]
      requestBody: { $ref: '#/components/requestBodies/MetricsQuery' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: >-
        HTTP Basic authorization. Credentials are your Emplifi API `token` and
        `secret`, base64-encoded as `token:secret`.
    oauth2:
      type: oauth2
      description: >-
        OAuth 2.0 authorization code flow. Create a Custom integration in
        Emplifi Settings to obtain client credentials.
      flows:
        authorizationCode:
          authorizationUrl: https://api.emplifi.io/oauth2/0/auth
          tokenUrl: https://api.emplifi.io/oauth2/0/token
          scopes: {}
  parameters:
    Network:
      name: network
      in: path
      required: true
      description: Social network key
      schema:
        type: string
        enum: [facebook, instagram, twitter, youtube, linkedin, pinterest, tiktok, snapchat]
    Id:
      name: id
      in: path
      required: true
      description: Resource identifier
      schema: { type: string }
  requestBodies:
    Query:
      required: false
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
    MetricsQuery:
      required: true
      description: Metrics query — profiles, metrics and a date range (max 100 profiles, 25 metrics, 12-month range).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MetricsQuery' }
    PostsQuery:
      required: true
      description: Posts query — profiles and a date range, cursor-paginated.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PostsQuery' }
  responses:
    Success:
      description: Successful response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    PagedSuccess:
      description: Successful, cursor-paginated response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PagedEnvelope' }
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ValidationError:
      description: Input validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: Rate limit exceeded (1000 req/hour account, 500 req/hour user)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    SuccessEnvelope:
      type: object
      properties:
        success: { type: boolean, const: true }
        header:
          type: array
          items: { type: object, additionalProperties: true }
        data: {}
      required: [success]
    PagedEnvelope:
      type: object
      properties:
        success: { type: boolean, const: true }
        data:
          type: array
          items: { type: object, additionalProperties: true }
        next:
          type: [string, 'null']
          description: Cursor for the next page
        remaining:
          type: [integer, 'null']
          description: Number of items remaining
      required: [success]
    ErrorEnvelope:
      type: object
      properties:
        success: { type: boolean, const: false }
        errors:
          type: array
          items:
            type: object
            properties:
              code: { type: integer }
              errors:
                type: array
                items: { type: string }
      required: [success, errors]
    MetricsQuery:
      type: object
      properties:
        profiles:
          type: array
          maxItems: 100
          items: { type: string }
        metrics:
          type: array
          maxItems: 25
          items: { type: string }
        dimensions:
          type: array
          items: { type: string }
        date_start: { type: string, format: date }
        date_end: { type: string, format: date }
      required: [profiles, metrics, date_start, date_end]
    PostsQuery:
      type: object
      properties:
        profiles:
          type: array
          items: { type: string }
        date_start: { type: string, format: date }
        date_end: { type: string, format: date }
        cursor: { type: string }
      required: [profiles, date_start, date_end]
