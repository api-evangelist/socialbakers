openapi: 3.1.0
info:
  title: Emplifi (Socialbakers) Public API
  version: '3'
  description: >-
    The Emplifi Public API (v3) — formerly the Socialbakers API — provides
    programmatic access to social media analytics, published content, profile
    and post metrics, community engagement, social listening, Facebook Ads,
    digital asset management (Assets), and customer care (Care) data across
    Facebook, Instagram, X/Twitter, YouTube, LinkedIn, Pinterest, TikTok and
    Snapchat. Socialbakers rebranded to Emplifi in 2021; this API is the
    successor to the original Socialbakers Public API.
    Requests are authenticated with HTTP Basic auth (API token:secret) or
    OAuth 2.0 authorization code flow. Metrics and posts endpoints accept a
    JSON query body (profiles, metrics, date range) and return a
    `{ "success": true, ... }` envelope.
  contact:
    name: Emplifi API Support
    url: https://api.emplifi.io/
  x-apievangelist:
    method: derived
    source: https://api.emplifi.io/ (Emplifi API v3 documentation) + https://github.com/Emplifi/public-api-tableau-wdc
    note: >-
      Derived from the published Emplifi Public API documentation and the
      official Emplifi public-api-tableau-wdc connector source. Endpoint paths,
      methods, auth schemes and the response envelope are taken from those
      public sources; request/response schemas are representative, not verbatim.
servers:
  - url: https://api.emplifi.io
    description: Emplifi Public API production
tags:
  - name: Reference
    description: Managed profiles, labels, label groups, listening queries, ad accounts
  - name: Profile Metrics
    description: Time-series and aggregate metrics per social profile
  - name: Posts
    description: Published content (posts / videos / tweets) per network
  - name: Assets
    description: Digital asset management — collections and assets
  - name: Care
    description: Customer care cases and messages
  - name: Community
    description: Community content, labeling and engagement metrics
  - name: Listening
    description: Social listening content and metrics
  - name: Ads
    description: Facebook Ads content and metrics
security:
  - basicAuth: []
  - oauth2: []
paths:
  /3/{network}/profiles:
    get:
      operationId: listProfiles
      summary: List managed profiles for a network
      tags: [Reference]
      parameters:
        - $ref: '#/components/parameters/Network'
      responses:
        '200':
          description: List of managed profiles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /3/profile/labels:
    get:
      operationId: getProfileLabels
      summary: List profile labels
      tags: [Reference]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /3/post/labels:
    get:
      operationId: getPostLabels
      summary: List post labels
      tags: [Reference]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /3/post/label-groups:
    get:
